name: Keep Streamlit app awake

on:
  schedule:
    # Avoid the busiest minute; leave ample margin below the 12-hour sleep window.
    - cron: "23 */3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/keep-streamlit-awake.yml"

permissions:
  contents: write

concurrency:
  group: keep-streamlit-awake
  cancel-in-progress: false

jobs:
  visit-app:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install browser
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Visit dashboard and wake it if necessary
        shell: bash
        run: |
          python - <<'PY'
          import re
          import time
          from pathlib import Path
          from playwright.sync_api import sync_playwright

          url = "https://ops-dashboard-portfolio.streamlit.app/"
          Path("availability").mkdir(exist_ok=True)
          with sync_playwright() as p:
              browser = p.chromium.launch()
              page = browser.new_page(viewport={"width": 1440, "height": 1000})
              try:
                  for attempt in range(3):
                      try:
                          page.goto(url, wait_until="domcontentloaded", timeout=60000)
                          deadline = time.monotonic() + 90
                          while time.monotonic() < deadline:
                              wake = page.get_by_role("button", name=re.compile(
                                  r"Yes, get this app back up|Wake.*app|Wake up", re.I))
                              if wake.count() and wake.first.is_visible():
                                  wake.first.click(timeout=10000)
                              metrics = page.locator('[data-testid="stMetricValue"]')
                              if metrics.count() and metrics.first.is_visible():
                                  if page.locator('[data-testid="stException"]').count():
                                      raise RuntimeError("Streamlit app reports an exception")
                                  page.wait_for_timeout(15000)
                                  page.screenshot(path="availability/dashboard.png", full_page=True)
                                  print("Dashboard rendered successfully:", page.url)
                                  break
                              page.wait_for_timeout(2000)
                          else:
                              raise RuntimeError("Dashboard metrics did not render")
                          break
                      except Exception as error:
                          print(f"Attempt {attempt + 1}/3 failed: {error}")
                          page.screenshot(path="availability/failure.png", full_page=True)
                          Path("availability/failure.txt").write_text(
                              page.locator("body").inner_text(), encoding="utf-8")
                          if attempt == 2:
                              raise
                          page.wait_for_timeout(10000)
              finally:
                  browser.close()
          PY
      - name: Save browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: streamlit-availability
          path: availability/
          retention-days: 7
          if-no-files-found: ignore
      - name: Preserve weekly repository activity
        # Repository heartbeat only; empty commits do not prove viewer activity.
        # Run even if the app check failed, and avoid frequent deployment commits.
        if: always()
        shell: bash
        run: |
          latest=$(git log -1 --format=%ct)
          now=$(date +%s)
          if (( now - latest >= 604800 )); then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty --message "chore: weekly availability heartbeat [skip ci]"
            git push origin HEAD:main
          fi
