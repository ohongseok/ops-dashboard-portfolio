name: Keep Streamlit app awake

on:
  schedule:
    # Streamlit Community Cloud sleeps after 12 hours without traffic.
    # A six-hour interval leaves room for occasional GitHub schedule delays.
    - cron: "23 */6 * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/keep-streamlit-awake.yml"

permissions:
  contents: write

concurrency:
  group: keep-streamlit-awake
  cancel-in-progress: false

jobs:
  reset-inactivity-timer:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check app health
        shell: bash
        run: |
          curl             --fail             --silent             --show-error             --retry 3             --retry-all-errors             --connect-timeout 15             --max-time 60             https://ops-dashboard-portfolio.streamlit.app/healthz

      - name: Check out the deployment branch
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Create an empty keep-awake commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty --message "chore: reset Streamlit inactivity timer [skip ci]"
          git push origin HEAD:main
